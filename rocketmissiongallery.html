<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket</title>

    <style>
        h1 {color: rgb(214, 0, 0);}
        p {font-size: 17px;
            color: rgb(235, 106, 106);}
        h3 {color: rgb(233, 76, 76);}
        body {background-color: black;}
        b {color: rgb(255, 0, 0);}
    </style>
</head>
<body>
    <center>
        <hr>
        <h1>Welcome to <b>rocket mission!</b></h1>
        <hr>
        <p>Today, our rocket is getting ready to travel across space</p>
        <h3>Step 1: Meet the <b>rocket</b></h3>
        <img src="rocketlaunch.png" alt="Rocket ready to launch" width="275" height="350">
        <p>This <b>rocket</b> will take us to a new planet.</p>
        <h3>Step 2: Our destination</h3>
        <img src="planet.png" alt="Mars" width="275" height="275">
        <p>We found a planet far away from us.</p>
        <h3>Step 3: Our astronaut</h3>
        <img src="astronaut.png" alt="Rocket ready to launch" width="275" height="300">
        <p>They are ready to reach the planet.</p>
        <hr>
        <hr>
        <video height="500" width="500" controls loop>
            <source src="astronautvideo.mp4" type="video/mp4">
        </video>
    </center>
</body>
</html>
