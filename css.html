<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        * {font-size: 16px;}
        body {background-color: rgb(127, 183, 236);}
        h1 {color: blue;
            font-size: 30px;}
        
        h2 {color: rgb(30, 0, 255)}
        p {color: rgb(189, 224, 241)}
        
        .my-detail {color: red}

        #card {background-color: rgb(166, 206, 241);}

        #card2 {background-color: rgb(93, 225, 237);}

        .other {color: red}

        
    </style>
</head>
<body>
    <h1>My colour card</h1>

    <p style="color: rgb(52, 13, 245);">This is my webpage!</p>
    <div id="card">
        <h2>About me</h2>
        <p class="my-detail">My name is Jeremy.</p>
        <p class="my-detail">My favourite colour is blue.</p>
        <p class="my-detail">My favourite subject is Maths.</p>
        <p class="my-detail">My favourite food is pasta.</p>

    </div>

    <div id="card2">
        <h2>My favourite things</h2>
        <p class="other">My favourite animal is a goldfish.</p>
        <p class="other">My favourite sport is tag rugby.</p>
    </div>
    
</body>
</html>
